name: Testmake
on:
  workflow_dispatch:
    inputs:
      Repository:
        description: "Repository"
        default: "hola"
      Report:
        description: "Report"
        default: "mundo"
jobs:
  testmake:
    name: ${{ github.event.inputs.Report }}
    runs-on: ubuntu-latest
    steps:
    - name: Copia repositorio
      uses: actions/checkout@main
    - name: Instala geci-testmake
      run: make install
    - name: geci-testmake ${{ github.event.inputs.Report }}
      env:
        BITBUCKET_API_TOKEN: ${{ secrets.BITBUCKET_API_TOKEN }}
        BITBUCKET_EMAIL: ${{ secrets.BITBUCKET_EMAIL }}
        TABLERO_API_SECRET_KEY: ${{ secrets.TABLERO_API_SECRET_KEY }}
      run: geci-testmake ${{ github.event.inputs.Repository }} ${{ github.event.inputs.Report }}
