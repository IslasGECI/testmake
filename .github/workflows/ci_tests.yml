name: Testmake ${{ github.event.inputs.Report }}
on:
  workflow_dispatch:
    inputs:
      Repository:
        description: "Repository"
        default: "hola"
      Report:
        description: "Report"
        default: "mundo"
jobs:
  testmake:
    runs-on: ubuntu-latest
    steps:
    - name: Copia repositorio
      uses: actions/checkout@main
    - name: Instala geci-testmake
      run: make install
    - name: geci-testmake ${{ github.event.inputs.Report }}
      env:
        TABLERO_API_SECRET_KEY: ${{ secrets.TABLERO_API_SECRET_KEY }}
        BITBUCKET_USERNAME: ${{ secrets.BITBUCKET_USERNAME }}
        BITBUCKET_PASSWORD: ${{ secrets.BITBUCKET_PASSWORD }}
      run: geci-testmake ${{ github.event.inputs.Repository }} ${{ github.event.inputs.Report }}
